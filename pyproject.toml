[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beijing-pm25"
version = "0.2.0"
description = "Reproducible Beijing PM2.5 data audit and staged regression investigation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "scipy>=1.14,<2",
  "statsmodels>=0.14.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
submission = ["reportlab>=4.4,<5", "python-pptx>=1,<2", "PyMuPDF>=1.26,<2"]

[project.scripts]
beijing-pm25 = "beijing_pm25.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
